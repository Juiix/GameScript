name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true

    steps:
      - name: 🛎️ Checkout repository
        uses: actions/checkout@v4

      - name: 🛠️ Setup .NET SDKs
        uses: actions/setup-dotnet@v4
        with:
            dotnet-version: '8.x'

      - name: 🧪 Test
        run: dotnet test GameScript.Language.Tests/GameScript.Language.Tests.csproj --configuration Release
