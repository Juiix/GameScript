name: Build & Publish VS Code Extension

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/publish-vscode.yml"
      - "Directory.Build.props"
      - "GameScript.Vscode/**"
      - "GameScript.LanguageServer/**"
      - "GameScript.Language/**"
      - "GameScript.Bytecode/**"
    tags: ['v*']          # publish on version tags, adjust as needed

jobs:
  vscode:
    runs-on: macos-latest
    env:
      CONFIGURATION: Release

    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-dotnet@v4
      with:
        dotnet-version: '8.x'

    - uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: 'GameScript.Vscode/package-lock.json'

    # ── Stamp version from Directory.Build.props ─────────────────────
    - name: Set version
      run: |
        VERSION=$(sed -n 's/.*<GameScriptVersion>\(.*\)<\/GameScriptVersion>.*/\1/p' Directory.Build.props)
        jq --arg v "$VERSION" '.version = $v' GameScript.Vscode/package.json > tmp.json
        mv tmp.json GameScript.Vscode/package.json

    # ── Build language-server (all RIDs) ──────────────────────────────
    - name: Make build script executable
      working-directory: Scripts
      run: chmod +x ./build-lsp.sh

    - name: Build language server
      working-directory: Scripts
      run: ./build-lsp.sh

    # ── Package VS Code extension (one VSIX per platform) ────────────
    - name: Install vsce
      run: npm install -g @vscode/vsce

    - name: Install extension deps
      working-directory: GameScript.Vscode
      run: npm ci

    - name: Compile extension
      working-directory: GameScript.Vscode
      run: npm run compile

    - name: Package
      working-directory: Scripts
      run: |
        chmod +x ./package-vscode.sh
        ./package-vscode.sh "$GITHUB_WORKSPACE/vsix"

    - name: Upload VSIXs as workflow artifact
      uses: actions/upload-artifact@v4
      with:
        name: vsix
        path: vsix/*.vsix

    # ── Publish to VS Code Marketplace ───────────────────────────────
    - name: Publish
      env:
        VSCE_PAT: ${{ secrets.VSCE_TOKEN }}
      run: npx vsce publish --packagePath vsix/*.vsix --pat "$VSCE_PAT"
